<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IM VALG 2026{% block title %}{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Special+Gothic&family=Special+Gothic+Expanded+One&display=swap" rel="stylesheet">
  {% load static %}
  <link rel="stylesheet" href="{% static "vote/styles.css" %}">
  <link rel="stylesheet" href="{% static "vote/input.css" %}">
</head>
{% block extra_js %}{% endblock %}
<body>
  {% if user.is_authenticated %}
  <header class="d-flex justify-content-between align-items-center p-3 bg-light border-bottom">
    <span class="fw-bold">Brukernavn: {{ user.username }}</span>
    <form action="{% url 'logout' %}" method="post" class="m-0">
      {% csrf_token %}
      <button type="submit" class="btn btn-outline-danger btn-sm">Logg ut</button>
    </form>
  </header>
  {% endif %}

  <main class="content py-4">
    {% block content %}{% endblock %}
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
