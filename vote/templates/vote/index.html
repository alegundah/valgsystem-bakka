{% extends "vote/base.html" %}

{% block title %} Log In Page {% endblock %}

{% block content %}

<style>
    .login-bg {
      
        background-image: url('/vote/templates/vote/Background.svg'); 
       
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        background-attachment: fixed;
    }
</style>

<div class="login-bg d-flex flex-column justify-content-center align-items-center min-vh-100 text-center">
    <h1 class="fw-bold mb-4">Velkommen til Valg 2026</h1>
    
    <div class="d-flex flex-column align-items-center">
        <label for="code-input" class="fs-5 mb-2">Skriv inn din kode</label>
        <input id="code-input" type="text" class="form-control text-center" style="max-width: 300px;">
    </div>
</div>

{% endblock %}
