{% extends "vote/base.html" %}

{% load static %}

{% block title %} / Login {% endblock %}

{% block content %}



<div class="d-flex flex-column justify-content-center align-items-center min-vh-100 text-center">
    <h1 class="fw-bold mb-4">Velkommen til Valg 2026</h1>
    <div class="d-flex flex-column align-items-center">
        <label for="code-input" class="fs-5 mb-2">Skriv inn din kode</label>

        <!-- Login form POST-ing password to login class view -->
        <form method="post" action="{% url "login" %}">
        {% csrf_token %}
            <input id="code-input" type="password" class="form-control text-center" style="max-width: 300px;" name="username" >
               <button id="toggle1234"  class="btn btn-outline-secondary" type="button" id="togglePassword" onclick="handlePasswordClick()">
              
            

        

                <svg  id="hidden" style="display:none" xmlns="http://www.w3.org/2000/svg" width="16"        height="16" fill="currentColor" class="bi bi-eye-slash" viewBox="0 0 16 16">
                <path d="M13.359 11.238C15.06 9.72 16 8 16 8s-3-5.5-8-5.5a7 7 0 0 0-2.79.588l.77.771A6 6 0 0 1 8 3.5c2.12 0 3.879 1.168 5.168 2.457A13 13 0 0 1 14.828 8q-.086.13-.195.288c-.335.48-.83 1.12-1.465 1.755q-.247.248-.517.486z"/>
                <path d="M11.297 9.176a3.5 3.5 0 0 0-4.474-4.474l.823.823a2.5 2.5 0 0 1 2.829 2.829zm-2.943 1.299.822.822a3.5 3.5 0 0 1-4.474-4.474l.823.823a2.5 2.5 0 0 0 2.829 2.829"/>
                <path d="M3.35 5.47q-.27.24-.518.487A13 13 0 0 0 1.172 8l.195.288c.335.48.83 1.12 1.465 1.755C4.121 11.332 5.881 12.5 8 12.5c.716 0 1.39-.133 2.02-.36l.77.772A7 7 0 0 1 8 13.5C3 13.5 0 8 0 8s.939-1.721 2.641-3.238l.708.709zm10.296 8.884-12-12 .708-.708 12 12z"/>
                </svg>
          
                <svg id="show" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-eye-fill" viewBox="0 0 16 16" >
                <path d="M10.5 8a2.5 2.5 0 1 1-5 0 2.5 2.5 0 0 1 5 0"/>
                <path d="M0 8s3-5.5 8-5.5S16 8 16 8s-3 5.5-8 5.5S0 8 0 8m8 3.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7"/>
                </svg> 

                
                <script>
                    function handlePasswordClick() {
                            togglePasswordVisibilty()
                            togglePasswordIcon()
                    }

                    function togglePasswordVisibilty() {
                        const ElPasswordInput = document.getElementById("code-input");
                        ElPasswordInput.type == "password" ? ElPasswordInput.type = "text" : ElPasswordInput.type = "password"
                    }

                    function togglePasswordIcon() {
                        const StyleShowPass = document.getElementById("show").style;
                        const StyleHidePass = document.getElementById("hidden").style;
                        StyleShowPass.display == "none" ? StyleShowPass.display = "flex" : StyleShowPass.display = "none"
                        StyleHidePass.display == "none" ? StyleHidePass.display = "flex" : StyleHidePass.display = "none"
                    }
                </script>


            

</button>

            

         
        </form>
            <input type="submit" value="login">

    </div>
    {% if error %}
        <p class="text-red">Prøv igjen</p>
    {% endif %}
</div>
<script src="{% static 'vote/js/password_visibility.js'%} defer></script>

{% endblock %}
